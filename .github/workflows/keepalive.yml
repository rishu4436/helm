# Pings the free Render API so it does not sleep between judge visits.
# Render free web services spin down after inactivity; this cron hits /health every 10 minutes.
name: helm-api-keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping HELM API health
        run: |
          set -euo pipefail
          url="${HELM_API_HEALTH_URL:-https://helm-api-v8lu.onrender.com/health}"
          echo "GET $url"
          # Cold starts can take ~50s on the free plan.
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 "$url"
        env:
          HELM_API_HEALTH_URL: https://helm-api-v8lu.onrender.com/health
